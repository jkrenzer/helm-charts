{{- include "common-library.deployment" (dict "globals" . "override" "keycloak.deployment") -}}
{{- define "keycloak.deployment" -}}
spec:
  template:
    spec:
      containers:
        - args: 
            - start-dev
            - "--spi-vault-file-key-resolvers=REALM_UNDERSCORE_KEY,KEY_ONLY"
            {{ if .Values.config.tls.enable -}}
            - "--https-certificate-file=/secrets/ssl/rsa/tls.crt" 
            - "--https-certificate-key-file=/secrets/ssl/rsa/tls.key"
            {{- end }}
          envFrom:
            - configMapRef:
                name: keycloak-config
            - secretRef:
                name: keycloak-secret
          name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ .Values.image.repository }}:{{ tpl .Values.image.tag . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9000
              name: management-http
            {{ if .Values.config.tls.enable -}}
            - containerPort: 8443
              name: https
            {{- end }}
          startupProbe:
            {{- tpl (toYaml .Values.startupProbe) . | nindent 12 }}
          livenessProbe:
            {{- tpl (toYaml .Values.livenessProbe) . | nindent 12 }}
          readinessProbe:
            {{- tpl (toYaml .Values.readinessProbe) . | nindent 12 }}
          resources:
            {{- tpl (toYaml .Values.resources) . | nindent 12 }}
          volumeMounts:
            - mountPath: /opt/keycloak/data/import
              name: pv
              subPath: import
            - mountPath: /opt/keycloak/providers
              name: pv
              subPath: providers
            - mountPath: /opt/keycloak/themes
              name: pv
              subPath: themes
            - mountPath: /opt/keycloak/conf
              name: pv
              subPath: conf
            - mountPath: /secrets/ssl/rsa
              readOnly: true
              {{- if .Values.config.tls.enable }}
              name: certs
              {{- else }}
              name: pv
              subPath: certs
              {{ end }}
      volumes:
        - name: pv
          persistentVolumeClaim:
            claimName: {{ tpl .Values.persistentVolumeClaim.name . }}
        {{- if .Values.config.tls.enable }}
        - name: certs
          secret:
            secretName: {{ tpl .Values.certSecret.name . }}
        {{- end }}
        - name: tmp-files
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector: 
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: 
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: 
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}
