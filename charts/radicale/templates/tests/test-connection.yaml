apiVersion: v1
kind: Pod
metadata:
  name: {{ .Values.common.name }}-test-connection
  labels:
    {{- toYaml .Values.common.labels | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: 
        - {{ tpl .Values.service.name . }}
  restartPolicy: Never
